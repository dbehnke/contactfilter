name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      BM_CONTACTS_FILE: "bm_contacts.csv"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')

      - name: Run GoReleaser (Snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Generate Contact List
        shell: bash
        run: |
          TIMESTAMP=$(date +%s)
          # GoReleaser builds to dist/
          # We'll use the linux-amd64 binary for generation
          BINARY="./dist/contactfilter_linux_amd64_v1/contactfilter"
          
          if [ ! -f "$BINARY" ]; then
             # Fallback for snapshot builds where directory structure might differ slightly or if we need to find it
             BINARY=$(find dist -name "contactfilter" -type f | grep linux_amd64 | head -n 1)
          fi
          
          chmod +x "$BINARY"
          
          if [ -f "${{ env.BM_CONTACTS_FILE }}" ]; then
            echo "Found Brandmeister contacts file: ${{ env.BM_CONTACTS_FILE }}"
            
            output_file="Baofeng_DM-32UV_Contacts_${TIMESTAMP}.csv"
            echo "Generating '$output_file'..."
            
            "$BINARY" \
              --merge \
              --brandmeister-csv "${{ env.BM_CONTACTS_FILE }}" \
              --filter-file countries.txt \
              --output-csv "$output_file"
              
            # Upload the generated CSV to the release if it's a tagged release
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              gh release upload ${{ github.ref_name }} "$output_file"
            else
              # For non-tags, just upload as artifact
              echo "Not a tagged release, skipping upload to release."
            fi
            
            # Always upload as workflow artifact
            echo "artifact_path=$output_file" >> $GITHUB_ENV
          else
             echo "::warning::Brandmeister contacts file not found, skipping generation."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Generated Contacts
        if: env.artifact_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-contacts
          path: ${{ env.artifact_path }}
